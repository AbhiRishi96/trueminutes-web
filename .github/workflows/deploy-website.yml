name: Sync release and deploy website

on:
  push:
    branches: [main]
    paths-ignore:
      ["docs/**", "graphify-out/**", "public/screenshots/**", "**.md"]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [trueminutes-release]

permissions:
  contents: read

concurrency:
  group: trueminutes-website-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.WEBSITE_ORIGIN || 'https://trueminutes-website.trueminutes-google-oauth.workers.dev' }}
      WRANGLER_SEND_METRICS: "false"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Test release selection
        run: npm run test:release
      - name: Compare published release with website
        id: release
        run: npm run release:probe
      - name: Validate deployment configuration
        if: steps.release.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set repository secret CLOUDFLARE_API_TOKEN before enabling automatic deployment."
            exit 1
          fi
      - name: Install, build, and validate
        if: steps.release.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          npm ci
          npm run build
          npm run typecheck
          npm run check:static
          npm run release:verify
      - name: Deploy the website Worker only
        if: steps.release.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
      - name: Verify deployed website
        if: steps.release.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: npm run check:live -- "$NEXT_PUBLIC_SITE_URL"
      - name: Publish run summary
        if: success()
        run: |
          if [ "${{ steps.release.outputs.changed }}" = "true" ] || [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Published release synchronized and website verified." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published release already synchronized. Scheduled runs skip deployment when unchanged." >> "$GITHUB_STEP_SUMMARY"
          fi
