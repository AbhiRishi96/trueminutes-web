name: Sync release and deploy website

on:
  push:
    branches: [main]
    paths-ignore:
      ["docs/**", "graphify-out/**", "public/screenshots/**", "**.md"]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [trueminutes-release, trueminutes-app]

permissions:
  contents: read

concurrency:
  group: trueminutes-website-production
  cancel-in-progress: false

jobs:
  deploy:
    # GitHub-hosted fallback. Production sync runs on the TrueMinutes
    # self-hosted runner (workflow Sync marketing website). This job skips
    # deploy when CLOUDFLARE_API_TOKEN is not set on this public repo.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.WEBSITE_ORIGIN || 'https://trueminutes-website.trueminutes-google-oauth.workers.dev' }}
      WRANGLER_SEND_METRICS: "false"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Test release selection
        run: npm run test:release
      - name: Compare published release with website
        id: release
        run: npm run release:probe
      - name: Check Cloudflare token
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No CLOUDFLARE_API_TOKEN on this repository. GitHub-hosted deploy is skipped; the TrueMinutes self-hosted runner owns production sync." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install, build, and validate
        if: steps.cloudflare.outputs.present == 'true' && (steps.release.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
        run: |
          npm ci
          npm run build
          npm run typecheck
          npm run check:static
          npm run release:verify
      - name: Deploy the website Worker only
        if: steps.cloudflare.outputs.present == 'true' && (steps.release.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
      - name: Verify deployed website
        if: steps.cloudflare.outputs.present == 'true' && (steps.release.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
        run: npm run check:live -- "$NEXT_PUBLIC_SITE_URL"
      - name: Publish run summary
        if: success()
        run: |
          echo "GitHub-hosted job finished. Production website sync is the TrueMinutes self-hosted workflow." >> "$GITHUB_STEP_SUMMARY"
